# pyproject.toml —— "人人可安装"链路的依赖与入口真相
# 安装：pipx install learning-factory（PyPI 直装）/ pipx install git+<仓库>（GitHub 直装）/ pipx install .（clone 后）
# 开发：pip install -e ".[web,dev]"（本仓库 clone 后的等价方式）
# 旧 requirements*.txt 仍保留（CI 与 git clone 直跑场景），依赖版本以本文件为准。

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "learning_factory"
version = "0.1.1"
description = "GLM 多智能体协作研究系统：主 Agent 调度 docs/repo/web/file_writer 四个子 Agent 完成工具学习、研究与长文档写入"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Noodle" }]
requires-python = ">=3.11"
# PyPI 页面分类索引（License 用 SPDX 表达式声明，按 PEP 639 不再重复 License classifier）
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.0.0,<2",
    "beautifulsoup4>=4.12.0",
]

[project.urls]
Homepage = "https://github.com/Shoothedrifter/LearningFactory"
Repository = "https://github.com/Shoothedrifter/LearningFactory"
Issues = "https://github.com/Shoothedrifter/LearningFactory/issues"
Changelog = "https://github.com/Shoothedrifter/LearningFactory/releases"

[project.optional-dependencies]
# Web 界面（learning_factory/server.py）为可选运行模式，CLI 用户无需安装
web = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
learning-factory = "learning_factory.agent:run_cli"

[tool.setuptools.packages.find]
include = ["learning_factory*"]

[tool.setuptools.package-data]
# 提示词/技能/静态页随包分发（load_prompt/SKILLS_DIR/STATIC_DIR 均按包内路径读取）
learning_factory = ["prompts/*.md", "skills/**/*.md", "static/*.html"]
